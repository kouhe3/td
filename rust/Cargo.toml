[package]
name = "tdjson_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tdjson_rs"
crate-type = ["cdylib"]

[dependencies]
# getLanguagePackString reads the same SQLite language pack database as TDLib
rusqlite = { version = "0.41", features = ["bundled"] }
# binlog_head: TDLib encrypts its binlog with AES-256-CTR under a PBKDF2 key
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
panic = "abort"